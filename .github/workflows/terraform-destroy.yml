name: Terraform Destroy
run-name: Destroy ${{ inputs.lab }}

on:
  workflow_dispatch:
    inputs:
      lab:
        description: "Lab a destruir"
        required: true
        type: choice
        options:
          - lab01-vpc
          - lab02-web
      confirmar:
        description: "Escribi destroy para confirmar"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-${{ inputs.lab }}
  cancel-in-progress: false

jobs:
  destroy:
    if: ${{ inputs.confirmar == 'destroy' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.lab }}

    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"

      - name: Init
        run: terraform init -input=false

      - name: Destroy
        run: terraform destroy -auto-approve -input=false