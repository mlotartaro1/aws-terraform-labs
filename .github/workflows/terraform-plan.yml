name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths: ["lab*/**"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  detectar:
    runs-on: ubuntu-latest
    outputs:
      labs: ${{ steps.labs.outputs.labs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detectar labs modificados (con backend S3)
        id: labs
        run: |
          cambiados=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | cut -d/ -f1 | sort -u)
          labs=()
          for d in $cambiados; do
            if [[ "$d" == lab* ]] && grep -qs 'backend "s3"' "$d"/*.tf; then
              labs+=("$d")
            fi
          done
          json=$(printf '%s\n' "${labs[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Labs a planificar: $json"
          echo "labs=$json" >> "$GITHUB_OUTPUT"

  plan:
    needs: detectar
    if: needs.detectar.outputs.labs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lab: ${{ fromJSON(needs.detectar.outputs.labs) }}
    defaults:
      run:
        working-directory: ${{ matrix.lab }}

    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"

      - name: Verificar formato
        run: terraform fmt -check

      - name: Init
        run: terraform init -input=false

      - name: Validar sintaxis
        run: terraform validate

      - name: Plan
        id: plan
        run: terraform plan -no-color -input=false

      - name: Publicar el plan en el PR
        uses: actions/github-script@v8
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
          LAB: ${{ matrix.lab }}
        with:
          script: |
            const plan = process.env.PLAN.slice(0, 60000);
            const body = "### Terraform Plan - " + process.env.LAB + "\n```\n" + plan + "\n```";
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });