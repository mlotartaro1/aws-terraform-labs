name: Terraform Apply
run-name: Apply ${{ inputs.lab || 'lab01-vpc' }}

on:
  push:
    branches: [main]
    paths: ["lab01-vpc/**"]
  workflow_dispatch:
    inputs:
      lab:
        description: "Lab a desplegar"
        required: true
        type: choice
        options:
          - lab01-vpc
          - lab02-web

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-${{ inputs.lab || 'lab01-vpc' }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.lab || 'lab01-vpc' }}

    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"

      - name: Init
        run: terraform init -input=false

      - name: Apply
        run: terraform apply -auto-approve -input=false